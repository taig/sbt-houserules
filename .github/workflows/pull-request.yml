name: CI
'on':
  pull_request:
    branches:
    - main
jobs:
  scalafmt:
    name: Scalafmt
    runs-on: ubuntu-latest
    env:
      SBT_TPOLECAT_DEV: 'true'
    needs: []
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - run: sbt scalafmtSbtCheck scalafmtCheckAll
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SBT_TPOLECAT_CI: 'true'
    needs: []
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - run: sbt compile
