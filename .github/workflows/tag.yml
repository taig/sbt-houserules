name: CD
'on':
  push:
    tags:
    - '*.*.*'
jobs:
  scalafmt:
    name: Scalafmt
    runs-on: ubuntu-latest
    env:
      SBT_TPOLECAT_DEV: 'true'
    needs: []
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - run: sbt "scalafmtSbtCheck; scalafmtCheckAll"
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SBT_TPOLECAT_CI: 'true'
    needs: []
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - run: sbt compile
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      SBT_TPOLECAT_RELEASE: 'true'
    needs:
    - scalafmt
    - build
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Release
      run: sbt ci-release
      env:
        PGP_PASSPHRASE: ${{secrets.PGP_PASSPHRASE}}
        PGP_SECRET: ${{secrets.PGP_SECRET}}
        SONATYPE_PASSWORD: ${{secrets.SONATYPE_PASSWORD}}
        SONATYPE_USERNAME: ${{secrets.SONATYPE_USERNAME}}
